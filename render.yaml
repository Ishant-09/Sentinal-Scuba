services:
  - type: web
    name: guildup-sanctuary
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build:all
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://guildup-sanctuary.onrender.com,http://localhost:3000"
